    <script>
(function () {
  const GITHUB_PAGES_REPO = "websitegenerator";
  const hostname = window.location.hostname;
  const onGithubPages = hostname === "github.io" || hostname.endsWith(".github.io");

  let baseHref = "/";
  if (onGithubPages) {
    const segments = window.location.pathname.split("/").filter(Boolean);
    if (segments.length > 0) {
      const first = segments[0];
      baseHref =
        first === GITHUB_PAGES_REPO ? `/${GITHUB_PAGES_REPO}/` : `/${first}/`;
    }
  }

  let baseEl = document.querySelector("base[data-site-base]");
  if (!baseEl) {
    baseEl = document.createElement("base");
    baseEl.setAttribute("data-site-base", "true");
    const viewport = document.querySelector('meta[name="viewport"]');
    if (viewport && viewport.parentNode) {
      viewport.insertAdjacentElement("afterend", baseEl);
    } else {
      document.head.insertBefore(baseEl, document.head.firstChild);
    }
  }
  baseEl.href = baseHref;
})();

</script>

<script>
  (function () {
    var header = document.querySelector(".site-header");
    var toggle = document.querySelector(".nav-toggle");
    var flyout = document.getElementById("site-nav-flyout");
    if (!header || !toggle || !flyout) return;

    var mobileQuery = window.matchMedia("(max-width: 767px)");

    function setNavOpen(open) {
      header.classList.toggle("is-nav-open", open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      if (mobileQuery.matches) {
        flyout.setAttribute("aria-hidden", open ? "false" : "true");
        document.body.classList.toggle("nav-scroll-lock", open);
      }
    }

    function syncNavForViewport() {
      if (!mobileQuery.matches) {
        setNavOpen(false);
        flyout.removeAttribute("aria-hidden");
        document.body.classList.remove("nav-scroll-lock");
      } else if (!header.classList.contains("is-nav-open")) {
        flyout.setAttribute("aria-hidden", "true");
      }
    }

    toggle.addEventListener("click", function () {
      setNavOpen(!header.classList.contains("is-nav-open"));
    });

    flyout.querySelectorAll("[data-nav-close]").forEach(function (el) {
      el.addEventListener("click", function () {
        setNavOpen(false);
      });
    });

    flyout.querySelectorAll(".nav-list a").forEach(function (link) {
      link.addEventListener("click", function () {
        if (mobileQuery.matches) {
          setNavOpen(false);
        }
      });
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && header.classList.contains("is-nav-open")) {
        setNavOpen(false);
        toggle.focus();
      }
    });

    if (typeof mobileQuery.addEventListener === "function") {
      mobileQuery.addEventListener("change", syncNavForViewport);
    } else if (typeof mobileQuery.addListener === "function") {
      mobileQuery.addListener(syncNavForViewport);
    }
    syncNavForViewport();
  })();
</script>
