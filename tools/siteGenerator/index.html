<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site generator</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #fafafa;
        color: #1f2937;
      }

      main {
        max-width: 100%;
        margin: 0 auto;
      }

      .preview-panel {
        margin-bottom: 20px;
        padding: 16px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }

      .preview-panel h2 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 600;
        color: #111827;
      }

      .preview-panel p {
        margin: 0 0 12px;
        font-size: 14px;
        color: #4b5563;
      }

      .preview-picker-root {
        font-size: 14px;
        line-height: 1.45;
      }

      .preview-picker-dropdown {
        margin: 6px 0 6px 8px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 6px 10px;
        background: #f9fafb;
      }

      .preview-picker-dropdown > summary {
        cursor: pointer;
        font-weight: 600;
        color: #374151;
        list-style-position: outside;
        margin-bottom: 4px;
      }

      .preview-picker-dropdown-body {
        margin-top: 6px;
        padding-left: 6px;
        border-left: 2px solid #e5e7eb;
      }

      .preview-picker-row .preview-picker-page-link {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
      }

      .preview-picker-row .preview-picker-page-link:hover {
        text-decoration: underline;
      }

      .preview-picker-error {
        margin: 0;
        font-size: 14px;
        color: #b91c1c;
      }

      .preview-picker-muted {
        color: #6b7280;
        font-size: 13px;
        margin: 2px 0;
      }

      .preview-picker-nested {
        padding-left: 14px;
      }

      .preview-digital-filter {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        margin-bottom: 14px;
      }

      .preview-digital-filter label {
        font-size: 14px;
        font-weight: 600;
        color: #374151;
      }

      .preview-digital-filter select {
        font-size: 14px;
        padding: 6px 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
        color: #1f2937;
        min-width: 11rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="preview-panel" aria-labelledby="preview-heading">
        <h2 id="preview-heading">Preview generated pages</h2>
        <p>
          Open a page below (paths match the static site). This page reads <code>?path=…</code> from the URL, generates
          HTML, and replaces the whole document. Open <code>index.html</code> again (or use back) to pick another page.
        </p>
        <div class="preview-digital-filter">
          <label for="preview-digital-filter">Listings</label>
          <select id="preview-digital-filter" aria-label="Filter listings by digital product">
            <option value="all" selected>All listings</option>
            <option value="true">Digital only</option>
            <option value="false">Physical only</option>
          </select>
        </div>
        <div id="preview-picker-root" aria-live="polite"></div>
      </section>
    </main>
    <script src="../editData/productData.js"></script>
    <script src="./previewTarget.js"></script>
    <script src="./displayFileTree.js"></script>
    <script src="./script.js"></script>
  </body>
  </html>
