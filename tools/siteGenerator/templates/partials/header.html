<header class="site-header">
  <div class="site-header-inner">
    <div class="header-top">
      <div class="brand">
        <img class="brand-logo" src="__FAVICON_PATH__" alt="__SHOP_NAME__ logo" />
        <span class="brand-name">__SHOP_NAME__</span>
        <form
          class="site-search-form"
          id="site-search-form"
          action="https://www.google.com/search"
          method="get"
          target="_blank"
          data-search-site="__GOOGLE_SITE_HOST__"
        >
          <input type="hidden" name="q" value="" />
          <label class="visually-hidden" for="site-search-query">Search this site with Google</label>
          <input
            id="site-search-query"
            class="site-search-input"
            type="search"
            autocomplete="off"
            placeholder="Search…"
            data-site-search-input
          />
          <button class="site-search-submit" type="submit">Search</button>
        </form>
      </div>
      <a class="header-cart-link" href="/cart" aria-label="Shopping cart">
        <svg class="header-cart-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
      </a>
    </div>
    <nav class="site-nav" aria-label="Main navigation">
      <ul class="nav-list">
        __NAV_ITEMS__
      </ul>
    </nav>
  </div>
</header>
<script>
  (function () {
    var form = document.getElementById("site-search-form");
    if (!form) return;
    form.addEventListener("submit", function () {
      var host = (form.getAttribute("data-search-site") || "").trim();
      var input = form.querySelector("[data-site-search-input]");
      var terms = (input && input.value ? input.value : "").trim();
      var q = host ? "site:" + host + (terms ? " " + terms : "") : terms;
      var hidden = form.querySelector('input[name="q"]');
      if (hidden) hidden.value = q;
    });
  })();
</script>
