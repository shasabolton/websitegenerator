<header class="site-header">
  <div class="site-header-inner">
    <div class="header-top">
      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav-flyout"
        aria-label="Open menu"
      >
        <span class="nav-toggle-icon" aria-hidden="true">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </span>
      </button>
      <div class="brand">
        <img class="brand-logo" src="__FAVICON_PATH__" alt="__SHOP_NAME__ logo" />
        <span class="brand-name">__SHOP_NAME__</span>
      </div>
      <a class="header-cart-link" href="cart" aria-label="Shopping cart">
        <svg class="header-cart-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
      </a>
    </div>
    <div class="nav-flyout" id="site-nav-flyout" aria-hidden="true">
      <button class="nav-flyout-backdrop" type="button" tabindex="-1" aria-label="Close menu" data-nav-close></button>
      <div class="nav-flyout-panel">
        <form
          class="site-search-form"
          id="site-search-form"
          action="https://www.google.com/search"
          method="get"
          target="_blank"
          data-search-site="__GOOGLE_SITE_HOST__"
        >
          <input type="hidden" name="q" value="" />
          <label class="visually-hidden" for="site-search-query">Search this site with Google</label>
          <input
            id="site-search-query"
            class="site-search-input"
            type="search"
            autocomplete="off"
            placeholder="Search…"
            data-site-search-input
          />
          <button class="site-search-submit" type="submit">Search</button>
        </form>
        <nav class="site-nav" aria-label="Main navigation">
          <ul class="nav-list">
            __NAV_ITEMS__
          </ul>
        </nav>
      </div>
    </div>
  </div>
</header>
<script>
  (function () {
    var form = document.getElementById("site-search-form");
    if (form) {
      form.addEventListener("submit", function () {
        var host = (form.getAttribute("data-search-site") || "").trim();
        var input = form.querySelector("[data-site-search-input]");
        var terms = (input && input.value ? input.value : "").trim();
        var q = host ? "site:" + host + (terms ? " " + terms : "") : terms;
        var hidden = form.querySelector('input[name="q"]');
        if (hidden) hidden.value = q;
      });
    }

    var header = document.querySelector(".site-header");
    var toggle = document.querySelector(".nav-toggle");
    var flyout = document.getElementById("site-nav-flyout");
    if (!header || !toggle || !flyout) return;

    var mobileQuery = window.matchMedia("(max-width: 767px)");

    function setNavOpen(open) {
      header.classList.toggle("is-nav-open", open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      if (mobileQuery.matches) {
        flyout.setAttribute("aria-hidden", open ? "false" : "true");
        document.body.classList.toggle("nav-scroll-lock", open);
      }
    }

    function syncNavForViewport() {
      if (!mobileQuery.matches) {
        setNavOpen(false);
        flyout.removeAttribute("aria-hidden");
        document.body.classList.remove("nav-scroll-lock");
      } else if (!header.classList.contains("is-nav-open")) {
        flyout.setAttribute("aria-hidden", "true");
      }
    }

    toggle.addEventListener("click", function () {
      setNavOpen(!header.classList.contains("is-nav-open"));
    });

    flyout.querySelectorAll("[data-nav-close]").forEach(function (el) {
      el.addEventListener("click", function () {
        setNavOpen(false);
      });
    });

    flyout.querySelectorAll(".nav-list a").forEach(function (link) {
      link.addEventListener("click", function () {
        if (mobileQuery.matches) {
          setNavOpen(false);
        }
      });
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && header.classList.contains("is-nav-open")) {
        setNavOpen(false);
        toggle.focus();
      }
    });

    if (typeof mobileQuery.addEventListener === "function") {
      mobileQuery.addEventListener("change", syncNavForViewport);
    } else if (typeof mobileQuery.addListener === "function") {
      mobileQuery.addListener(syncNavForViewport);
    }
    syncNavForViewport();
  })();
</script>
