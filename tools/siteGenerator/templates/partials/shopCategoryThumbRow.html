<div class="shop-category-scroll" data-shop-category-scroll data-fade-start="false" data-fade-end="false">
  <button
    type="button"
    class="shop-category-scroll-btn shop-category-scroll-btn--prev"
    data-shop-scroll="prev"
    aria-label="Scroll __CATEGORY_NAME__ products left"
    hidden
  >
    <span class="shop-category-scroll-btn-icon" aria-hidden="true">&lsaquo;</span>
  </button>
  <div class="shop-category-scroll-viewport">
    <div class="shop-category-scroll-fade shop-category-scroll-fade--start" aria-hidden="true"></div>
    <div class="shop-category-scroll-fade shop-category-scroll-fade--end" aria-hidden="true"></div>
    <div class="product-thumb-row shop-category-scroll-track" tabindex="0">
      __PRODUCT_THUMBS__
    </div>
  </div>
  <button
    type="button"
    class="shop-category-scroll-btn shop-category-scroll-btn--next"
    data-shop-scroll="next"
    aria-label="Scroll __CATEGORY_NAME__ products right"
  >
    <span class="shop-category-scroll-btn-icon" aria-hidden="true">&rsaquo;</span>
  </button>
</div>
