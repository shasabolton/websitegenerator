<section class="page-content product-page">
  __BREADCRUMBS__
  <h1>__PRODUCT_TITLE__</h1>
  <p class="product-body-price">__PRODUCT_PRICE__</p>
  __PRODUCT_VARIATIONS_HTML__
  <p class="product-body-actions">
    <button type="button" class="product-add-to-cart-btn" id="product-add-to-cart-btn">Add to cart</button>
    <span
      id="product-add-to-cart-feedback"
      class="product-add-to-cart-feedback"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></span>
  </p>
  __PRODUCT_CAROUSEL__
  <div class="product-body-description">__PRODUCT_DESCRIPTION__</div>
  <script>
    (function () {
      var cart = window.siteCart;
      var boot = __PRODUCT_CART_BOOTSTRAP_JSON__;
      var btn = document.getElementById("product-add-to-cart-btn");
      var feedback = document.getElementById("product-add-to-cart-feedback");
      var resetTimer;
      if (btn && cart && boot && boot.sku) {
        btn.addEventListener("click", function () {
          var sku = String(boot.sku || "").trim();
          var opts = {
            productPath: String(boot.productPath || "").trim(),
          };
          var vars = boot.variations;
          if (vars && vars.length) {
            var encParts = [];
            var summParts = [];
            for (var vi = 0; vi < vars.length; vi++) {
              var ax = vars[vi];
              var sel = document.getElementById("product-variation-" + (vi + 1));
              var val = sel && sel.value != null ? String(sel.value).trim() : "";
              if (!val) {
                window.alert("Please choose an option for " + (ax.name || "this product") + ".");
                return;
              }
              encParts.push(
                encodeURIComponent(String(ax.name || "")) + "=" + encodeURIComponent(val),
              );
              summParts.push(String(ax.name || "").trim() + ": " + val);
            }
            opts.lineId = sku + "::" + encParts.join("&");
            opts.variationSummary = summParts.join("; ");
          }
          btn.disabled = true;
          cart
            .addToCartFromSku(sku, 1, opts)
            .then(function (ok) {
              if (!ok) {
                window.alert("Could not add to cart.");
                return;
              }
              if (resetTimer) {
                window.clearTimeout(resetTimer);
              }
              btn.classList.add("is-added");
              btn.textContent = "Added";
              if (feedback) {
                feedback.textContent = "Added to your cart.";
                feedback.classList.add("is-visible");
              }
              resetTimer = window.setTimeout(function () {
                btn.classList.remove("is-added");
                btn.textContent = "Add to cart";
                if (feedback) {
                  feedback.textContent = "";
                  feedback.classList.remove("is-visible");
                }
              }, 2800);
            })
            .catch(function () {
              window.alert("Could not add to cart.");
            })
            .finally(function () {
              btn.disabled = false;
            });
        });
      }
    })();
  </script>
</section>
