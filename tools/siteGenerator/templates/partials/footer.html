<footer class="site-footer">
  <div class="footer-content">
    <p class="footer-heading">Stay connected</p>
    <div class="footer-links">__SOCIAL_LINKS__</div>
    <form
      id="newsletter"
      class="footer-subscribe-form"
      action="https://docs.google.com/forms/d/e/1FAIpQLSe5K8SJbldzZ46AbY1LvyogCVWnCZPbln1rAUFi1vmc879KvQ/formResponse"
      method="post"
      target="_self"
      data-signup-api-url="__NEWSLETTER_SIGNUP_API_URL__"
      data-turnstile-sitekey="__TURNSTILE_SITEKEY__"
    >
      <p class="footer-form-heading">__NEWSLETTER_LABEL__</p>
      <div class="footer-form-field">
        <label class="footer-form-label" for="footer-subscribe-name">Name</label>
        <input
          id="footer-subscribe-name"
          class="footer-form-input"
          name="entry.268156310"
          type="text"
          autocomplete="name"
        />
      </div>
      <div class="footer-form-field">
        <label class="footer-form-label" for="footer-subscribe-email">Email</label>
        <input
          id="footer-subscribe-email"
          class="footer-form-input"
          name="entry.866413073"
          type="email"
          autocomplete="email"
          required
        />
      </div>
      <div class="footer-form-hp" aria-hidden="true">
        <label for="footer-subscribe-website">Website</label>
        <input
          id="footer-subscribe-website"
          name="website"
          type="text"
          tabindex="-1"
          autocomplete="off"
        />
      </div>
      <div class="footer-turnstile" data-turnstile-mount></div>
      <p class="footer-form-status" data-newsletter-status hidden></p>
      <button class="footer-subscribe-button" type="submit">Subscribe</button>
    </form>
    <nav class="footer-policy-links" aria-label="Store policies">
      <a href="returns">Returns &amp; refunds</a>
    </nav>
    <p class="footer-contact">__CONTACT_BLOCK__</p>
    __PAYMENT_METHODS__
  </div>
</footer>
<script src="shared-assets/script/newsletterSignup.js" defer></script>
