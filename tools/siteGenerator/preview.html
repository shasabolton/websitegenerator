<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homepage Preview</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        background: #111827;
        color: #f9fafb;
      }

      .preview-toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        background: rgba(17, 24, 39, 0.95);
        border-bottom: 1px solid #374151;
      }

      .preview-toolbar a {
        color: #93c5fd;
      }

      .preview-status {
        margin: 0;
        font-size: 14px;
      }

      .preview-status.error {
        color: #fecaca;
      }

      .preview-container {
        min-height: calc(100vh - 48px);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="preview-toolbar">
      <a href="./index.html">Back to data table</a>
      <p id="preview-status" class="preview-status">Generating preview...</p>
    </div>

    <script src="./generateHeaderAndFooter.js"></script>
    <script src="./generateShop.js"></script>
    <script src="./generateCategory.js"></script>
    <script>
      const PREVIEW_INTERCEPT_SCRIPT = `
        <script>
          (function () {
            if (window.__previewNavInstalled) return;
            window.__previewNavInstalled = true;
            document.addEventListener("click", async function (event) {
              const link = event.target.closest("a[href]");
              if (!link) return;

              const href = link.getAttribute("href");
              if (!href) return;
              const url = new URL(href, window.location.origin);
              if (!url.pathname.startsWith("/shop")) return;

              event.preventDefault();

              try {
                const slug = url.pathname.split("/shop/")[1]?.replace(/\\/+$/, "");
                if (!slug) {
                  const html = await window.generateShop.generateShopHtml();
                  document.open();
                  document.write(html + PREVIEW_INTERCEPT_SCRIPT);
                  document.close();
                  return;
                }

                const html = await window.generateCategory.generateCategoryHtmlBySlug(slug);
                document.open();
                document.write(html + PREVIEW_INTERCEPT_SCRIPT);
                document.close();
              } catch (error) {
                console.error("Preview navigation generation failed", error);
              }
            });
          })();
        <\/script>
      `;

      function parsePreviewTarget() {
        const params = new URLSearchParams(window.location.search);
        const page = params.get("page");
        const category = params.get("category");
        if (page === "category" && category) {
          return { type: "category", category };
        }
        return { type: "shop", category: null };
      }

      async function loadPreview() {
        const status = document.getElementById("preview-status");
        if (!status) {
          return;
        }

        try {
          const target = parsePreviewTarget();
          const html =
            target.type === "category"
              ? await window.generateCategory.generateCategoryHtml(target.category)
              : await window.generateShop.generateShopHtml();
          document.open();
          document.write(html + PREVIEW_INTERCEPT_SCRIPT);
          document.close();
        } catch (error) {
          status.classList.add("error");
          status.textContent = `Failed to build preview: ${error.message}`;
        }
      }

      window.addEventListener("load", loadPreview);
    </script>
  </body>
</html>
