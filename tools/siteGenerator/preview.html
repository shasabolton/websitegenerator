<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homepage Preview</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        background: #111827;
        color: #f9fafb;
      }

      .preview-toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        background: rgba(17, 24, 39, 0.95);
        border-bottom: 1px solid #374151;
      }

      .preview-toolbar a {
        color: #93c5fd;
      }

      .preview-status {
        margin: 0;
        font-size: 14px;
      }

      .preview-status.error {
        color: #fecaca;
      }

      .preview-container {
        min-height: calc(100vh - 48px);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="preview-toolbar">
      <a href="./index.html">Back to data table</a>
      <p id="preview-status" class="preview-status">Generating preview...</p>
    </div>

    <script src="./generateHeaderAndFooter.js"></script>
    <script src="./siteGenerator.js"></script>
    <script>
      async function loadPreview() {
        const status = document.getElementById("preview-status");
        if (!status) {
          return;
        }

        try {
          const html = await window.siteGenerator.generateHomepageHtml({ absoluteAssetPaths: true });
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          status.classList.add("error");
          status.textContent = `Failed to build preview: ${error.message}`;
        }
      }

      window.addEventListener("load", loadPreview);
    </script>
  </body>
</html>
