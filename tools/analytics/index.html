<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Analytics — visitor journeys</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: #1f2937;
        --c-click: #2563eb;
        --c-carousel: #0d9488;
        --c-video: #7c3aed;
        --c-cart: #16a34a;
        --c-checkout: #ca8a04;
        --c-purchase: #ea580c;
        --c-scroll: #9ca3af;
        --c-field: #64748b;
        --c-problem: #dc2626;
        --c-dead: #f97316;
        --c-bot: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f3f4f6;
      }

      a {
        color: #1d4ed8;
      }

      header.top {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        padding: 10px 16px;
      }

      .top-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
      }

      .top-row + .top-row {
        margin-top: 8px;
      }

      h1 {
        margin: 0;
        font-size: 1.15rem;
      }

      .back-link {
        font-size: 0.85rem;
        text-decoration: none;
      }

      .spacer {
        flex: 1;
      }

      label.ctl {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: #374151;
      }

      select,
      input[type="date"],
      input[type="search"],
      input[type="password"] {
        font: inherit;
        font-size: 0.85rem;
        padding: 5px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
      }

      button {
        font: inherit;
        font-size: 0.85rem;
        padding: 5px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #f3f4f6;
      }

      button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }

      button.primary:hover {
        background: #1d4ed8;
      }

      main {
        padding: 14px 16px 60px;
      }

      .login {
        max-width: 24rem;
        margin: 4rem auto;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 24px;
      }

      .login h1 {
        margin-bottom: 6px;
      }

      .login p {
        margin: 0 0 14px;
        font-size: 0.9rem;
        color: #4b5563;
      }

      .login form {
        display: grid;
        gap: 10px;
      }

      .login input[type="password"] {
        font-size: 1rem;
        padding: 8px 10px;
      }

      .error {
        color: #b91c1c;
        font-size: 0.9rem;
      }

      .status {
        font-size: 0.85rem;
        color: #6b7280;
      }

      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .stat {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 8px 12px;
        min-width: 7.5rem;
      }

      .stat b {
        display: block;
        font-size: 1.25rem;
      }

      .stat span {
        font-size: 0.78rem;
        color: #6b7280;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 0.78rem;
        color: #4b5563;
        margin-bottom: 14px;
      }

      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: -1px;
      }

      details.day {
        margin-bottom: 14px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        overflow: hidden;
      }

      details.day > summary {
        cursor: pointer;
        padding: 10px 14px;
        font-weight: 700;
        background: #f9fafb;
        border-bottom: 1px solid #e5e7eb;
        list-style-position: inside;
      }

      details.day > summary .day-counts {
        font-weight: 400;
        font-size: 0.85rem;
        color: #6b7280;
        margin-left: 10px;
      }

      .visit {
        display: grid;
        grid-template-columns: 250px 1fr;
        border-bottom: 1px solid #f3f4f6;
        border-left: 4px solid transparent;
      }

      .visit:last-child {
        border-bottom: none;
      }

      .visit.has-problem {
        border-left-color: var(--c-problem);
      }

      .visit.has-cart {
        border-left-color: var(--c-cart);
      }

      .visit.has-purchase {
        border-left-color: var(--c-purchase);
      }

      .visit-meta {
        padding: 8px 10px;
        font-size: 0.8rem;
        line-height: 1.45;
        cursor: pointer;
        border-right: 1px solid #f3f4f6;
      }

      .visit-meta:hover {
        background: #f9fafb;
      }

      .visit-time {
        font-weight: 700;
        font-size: 0.85rem;
      }

      .badge {
        display: inline-block;
        padding: 0 7px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        background: #e5e7eb;
        color: #374151;
        margin: 1px 2px 1px 0;
      }

      .badge.ads {
        background: #fef3c7;
        color: #92400e;
      }

      .badge.search {
        background: #dbeafe;
        color: #1e40af;
      }

      .badge.social {
        background: #fce7f3;
        color: #9d174d;
      }

      .badge.etsy {
        background: #ffedd5;
        color: #9a3412;
      }

      .badge.direct {
        background: #f3f4f6;
        color: #4b5563;
      }

      .muted {
        color: #6b7280;
      }

      .keyword {
        color: #92400e;
        font-style: italic;
      }

      .flow {
        display: flex;
        align-items: center;
        gap: 0;
        padding: 10px 12px;
        overflow-x: auto;
      }

      .arrow {
        flex: 0 0 auto;
        color: #9ca3af;
        font-size: 0.8rem;
        padding: 0 3px;
      }

      .bar {
        position: relative;
        flex: 0 0 auto;
        height: 34px;
        border-radius: 6px;
        background: #e0e7ff;
        border: 1px solid #c7d2fe;
        overflow: visible;
      }

      .bar.t-home {
        background: #e0f2fe;
        border-color: #bae6fd;
      }

      .bar.t-category {
        background: #ede9fe;
        border-color: #ddd6fe;
      }

      .bar.t-product {
        background: #fef9c3;
        border-color: #fde68a;
      }

      .bar.t-cart {
        background: #dcfce7;
        border-color: #bbf7d0;
      }

      .bar.t-blog {
        background: #fae8ff;
        border-color: #f5d0fe;
      }

      .bar-text {
        position: absolute;
        inset: 0;
        padding: 2px 6px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 0.72rem;
        line-height: 1.25;
        pointer-events: none;
      }

      .bar-text b {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
      }

      .bar-text span {
        color: #6b7280;
      }

      .marker {
        position: absolute;
        bottom: -5px;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        border-radius: 50%;
        border: 1.5px solid #fff;
        background: var(--c-click);
        cursor: help;
        z-index: 2;
      }

      .marker:hover {
        transform: scale(1.5);
        z-index: 3;
      }

      .m-click {
        background: var(--c-click);
      }
      .m-carousel {
        background: var(--c-carousel);
      }
      .m-video {
        background: var(--c-video);
      }
      .m-cart {
        background: var(--c-cart);
        width: 13px;
        height: 13px;
        margin-left: -6px;
      }
      .m-checkout {
        background: var(--c-checkout);
        width: 13px;
        height: 13px;
        margin-left: -6px;
      }
      .m-purchase {
        background: var(--c-purchase);
        width: 14px;
        height: 14px;
        margin-left: -7px;
      }
      .m-scroll {
        background: var(--c-scroll);
        width: 7px;
        height: 7px;
        margin-left: -3px;
        bottom: -3px;
      }
      .m-field,
      .m-select,
      .m-submit {
        background: var(--c-field);
      }
      .m-rage,
      .m-error {
        background: var(--c-problem);
        border-radius: 2px;
        transform: rotate(45deg);
      }
      .m-dead {
        background: var(--c-dead);
        border-radius: 2px;
      }
      .m-flood,
      .m-bot {
        background: var(--c-bot);
        border-radius: 2px;
      }
      .m-skipped {
        background: #d1d5db;
        width: 7px;
        height: 7px;
        margin-left: -3px;
        bottom: -3px;
      }

      .visit.is-bot {
        opacity: 0.6;
        border-left-color: var(--c-bot);
      }

      .visit-details {
        grid-column: 1 / -1;
        padding: 10px 14px 14px;
        background: #f9fafb;
        border-top: 1px solid #e5e7eb;
        font-size: 0.8rem;
      }

      .visit-details table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 6px;
      }

      .visit-details td,
      .visit-details th {
        text-align: left;
        padding: 3px 8px 3px 0;
        vertical-align: top;
        border-bottom: 1px solid #eef0f3;
      }

      .visit-details th {
        color: #6b7280;
        font-weight: 600;
      }

      .visit-details .page-head td {
        font-weight: 700;
        padding-top: 8px;
      }

      .kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 12px;
        word-break: break-all;
      }

      .kv dt {
        color: #6b7280;
      }

      .kv dd {
        margin: 0;
      }

      .tooltip {
        position: fixed;
        z-index: 50;
        max-width: 320px;
        padding: 6px 9px;
        border-radius: 6px;
        background: #111827;
        color: #f9fafb;
        font-size: 0.78rem;
        line-height: 1.4;
        pointer-events: none;
        display: none;
      }

      .tooltip .tt-detail {
        color: #d1d5db;
        word-break: break-all;
      }

      .empty {
        background: #fff;
        border: 1px dashed #d1d5db;
        border-radius: 10px;
        padding: 30px;
        text-align: center;
        color: #6b7280;
      }

      @media (max-width: 760px) {
        .visit {
          grid-template-columns: 1fr;
        }

        .visit-meta {
          border-right: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="tooltip" id="tooltip"></div>

    <script>
      (function () {
        const PASSWORD_KEY = "cc-analytics-password";
        const app = document.getElementById("app");
        const tooltip = document.getElementById("tooltip");
        const MS_PER_DAY = 86400000;

        const EVENT_TYPES = {
          click: "Click",
          carousel: "Photo carousel",
          video: "Video",
          cart: "Add to cart",
          checkout: "Checkout",
          purchase: "Purchase",
          scroll: "Scroll",
          field: "Form field",
          select: "Option chosen",
          submit: "Form submitted",
          dead: "Click on something not clickable",
          rage: "Rage click",
          error: "Error",
          flood: "Click flood",
          bot: "Possible bot",
          skipped: "Quick pages skipped",
        };
        const PROBLEM_TYPES = new Set(["rage", "dead", "error"]);

        const state = {
          endpoint: "",
          siteUrl: "",
          categorySlugs: new Set(),
          password: "",
          data: null,
          range: "7",
          customFrom: "",
          customTo: "",
          source: "all",
          onlyCart: false,
          onlyProblems: false,
          hideBounces: true,
          hideBots: true,
          pageFilter: "",
          scale: 240,
          expanded: new Set(),
        };

        function escapeHtml(value) {
          return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        function formatDuration(ms) {
          const s = Math.round((Number(ms) || 0) / 1000);
          if (s < 60) {
            return `${s}s`;
          }
          const m = Math.floor(s / 60);
          if (m < 60) {
            return `${m}m ${String(s % 60).padStart(2, "0")}s`;
          }
          return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
        }

        function formatClock(ms) {
          return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }

        function dayKey(ms) {
          const d = new Date(ms);
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }

        function dayLabel(key) {
          const [y, m, d] = key.split("-").map(Number);
          const date = new Date(y, m - 1, d);
          const today = dayKey(Date.now());
          const yesterday = dayKey(Date.now() - MS_PER_DAY);
          const text = date.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
          if (key === today) {
            return `Today — ${text}`;
          }
          if (key === yesterday) {
            return `Yesterday — ${text}`;
          }
          return text;
        }

        function ordinal(n) {
          const s = ["th", "st", "nd", "rd"];
          const v = n % 100;
          return n + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        function hostOf(url) {
          try {
            return new URL(url).hostname.replace(/^www\./, "");
          } catch {
            return "";
          }
        }

        function classifySource(session) {
          const p = session.params || {};
          const ref = hostOf(session.referrer || "");
          const medium = String(p.utm_medium || "").toLowerCase();
          const utmSource = String(p.utm_source || "").toLowerCase();
          if (p.gclid || p.gbraid || p.wbraid || (utmSource === "google" && /cpc|ppc|paid/.test(medium))) {
            return { key: "ads", label: "Google Ad", css: "ads" };
          }
          if (p.fbclid || /facebook\.|instagram\.|fb\.me|t\.co$|pinterest\.|tiktok\.|youtube\.|reddit\./.test(ref)) {
            const name = /instagram/.test(ref) ? "Instagram" : /facebook|fb\.me/.test(ref) || p.fbclid ? "Facebook" : ref;
            return { key: "social", label: name, css: "social" };
          }
          if (utmSource) {
            return { key: "campaign", label: p.utm_source, css: "" };
          }
          if (/(^|\.)google\./.test(ref)) {
            return { key: "search", label: "Google search", css: "search" };
          }
          if (/bing\.|duckduckgo\.|yahoo\.|ecosia\.|baidu\.|yandex\.|brave\./.test(ref)) {
            return { key: "search", label: `Search: ${ref}`, css: "search" };
          }
          if (/etsy\./.test(ref)) {
            return { key: "etsy", label: "Etsy", css: "etsy" };
          }
          if (ref) {
            return { key: "referral", label: ref, css: "" };
          }
          return { key: "direct", label: "Direct / unknown", css: "direct" };
        }

        function pageType(url) {
          const path = String(url || "/").split(/[?#]/)[0].replace(/\/+$/, "") || "/";
          const parts = path.split("/").filter(Boolean);
          if (!parts.length || (parts.length === 1 && parts[0] === "shop")) {
            return "home";
          }
          if (parts[0] === "cart") {
            return "cart";
          }
          if (parts[0] === "blog") {
            return "blog";
          }
          if (parts[0] === "shop" && parts[1]) {
            return state.categorySlugs.has(parts[1]) && parts.length === 2 ? "category" : "product";
          }
          return "page";
        }

        function sessionStats(session) {
          let activeMs = 0;
          const types = new Set();
          const flags = new Set();
          for (const page of session.pages) {
            activeMs += page.activeMs || 0;
            for (const e of page.events || []) {
              types.add(e.type);
            }
            for (const f of page.flags || []) {
              flags.add(f);
            }
          }
          return {
            activeMs,
            hasCart: types.has("cart"),
            hasCheckout: types.has("checkout"),
            hasPurchase: types.has("purchase"),
            hasProblem: [...types].some((t) => PROBLEM_TYPES.has(t)),
            isBot: flags.has("bot") || types.has("bot"),
            isThrottled: flags.has("throttled"),
          };
        }

        // ---- API ----

        async function api(path, params) {
          const url = new URL(`${state.endpoint}${path}`);
          for (const [k, v] of Object.entries(params || {})) {
            url.searchParams.set(k, v);
          }
          const res = await fetch(url, {
            headers: { Authorization: `Bearer ${state.password}` },
            cache: "no-store",
          });
          if (res.status === 401) {
            const err = new Error("Wrong password");
            err.unauthorized = true;
            throw err;
          }
          if (!res.ok) {
            throw new Error(`Server error (${res.status})`);
          }
          return res.json();
        }

        function rangeBounds() {
          const now = new Date();
          const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
          if (state.range === "today") {
            return { from: startOfToday, to: Date.now() };
          }
          if (state.range === "yesterday") {
            return { from: startOfToday - MS_PER_DAY, to: startOfToday - 1 };
          }
          if (state.range === "custom" && state.customFrom && state.customTo) {
            const [fy, fm, fd] = state.customFrom.split("-").map(Number);
            const [ty, tm, td] = state.customTo.split("-").map(Number);
            return {
              from: new Date(fy, fm - 1, fd).getTime(),
              to: new Date(ty, tm - 1, td + 1).getTime() - 1,
            };
          }
          const days = Number(state.range) || 7;
          return { from: startOfToday - (days - 1) * MS_PER_DAY, to: Date.now() };
        }

        async function loadData() {
          setStatus("Loading…");
          try {
            const { from, to } = rangeBounds();
            state.data = await api("/visits", { from, to });
            setStatus(
              state.data.truncated
                ? "Showing the most recent 3000 visits only. Choose a shorter date range to see all."
                : `Updated ${formatClock(Date.now())}`,
            );
            renderResults();
          } catch (err) {
            if (err.unauthorized) {
              signOut("Your password was not accepted. Please sign in again.");
              return;
            }
            setStatus(`Could not load data: ${err.message}`, true);
          }
        }

        // ---- Login ----

        function renderLogin(message) {
          app.innerHTML = `
            <div class="login">
              <h1>Visitor analytics</h1>
              <p>Enter your analytics password to see what visitors did on the site.</p>
              <form id="login-form">
                <input type="password" id="login-password" autocomplete="current-password" placeholder="Analytics password" required />
                <label class="ctl"><input type="checkbox" id="login-remember" checked /> Remember on this device</label>
                <button type="submit" class="primary">Show visits</button>
                <div class="error" id="login-error">${escapeHtml(message || "")}</div>
              </form>
              <p style="margin-top:14px"><a class="back-link" href="../index.html">← Back to tools</a></p>
            </div>`;
          const form = document.getElementById("login-form");
          const input = document.getElementById("login-password");
          input.focus();
          form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const errorEl = document.getElementById("login-error");
            errorEl.textContent = "Checking…";
            state.password = input.value;
            try {
              await api("/login");
              const remember = document.getElementById("login-remember").checked;
              (remember ? localStorage : sessionStorage).setItem(PASSWORD_KEY, state.password);
              renderDashboard();
            } catch (err) {
              errorEl.textContent = err.unauthorized ? "Wrong password." : `Could not connect: ${err.message}`;
            }
          });
        }

        function signOut(message) {
          localStorage.removeItem(PASSWORD_KEY);
          sessionStorage.removeItem(PASSWORD_KEY);
          state.password = "";
          state.data = null;
          renderLogin(message);
        }

        // ---- Dashboard ----

        function setStatus(text, isError) {
          const el = document.getElementById("status");
          if (el) {
            el.textContent = text;
            el.className = isError ? "error" : "status";
          }
        }

        function renderDashboard() {
          const notrackUrl = state.siteUrl ? `${state.siteUrl.replace(/\/+$/, "")}/?notrack=1` : "";
          app.innerHTML = `
            <header class="top">
              <div class="top-row">
                <a class="back-link" href="../index.html">← Tools</a>
                <h1>Visitor journeys</h1>
                <label class="ctl">Dates
                  <select id="f-range">
                    <option value="today">Today</option>
                    <option value="yesterday">Yesterday</option>
                    <option value="7">Last 7 days</option>
                    <option value="30">Last 30 days</option>
                    <option value="90">Last 90 days</option>
                    <option value="custom">Custom…</option>
                  </select>
                </label>
                <span id="custom-range" hidden>
                  <input type="date" id="f-from" /> – <input type="date" id="f-to" />
                </span>
                <button type="button" id="refresh">Refresh</button>
                <span id="status" class="status"></span>
                <span class="spacer"></span>
                ${notrackUrl ? `<a class="back-link" href="${escapeHtml(notrackUrl)}" target="_blank" rel="noopener" title="Opens your site once with ?notrack=1 so visits from this browser are not recorded. Do this on each of your devices.">Exclude my visits</a>` : ""}
                <button type="button" id="sign-out">Sign out</button>
              </div>
              <div class="top-row">
                <label class="ctl">Came from
                  <select id="f-source">
                    <option value="all">Anywhere</option>
                    <option value="ads">Google Ads</option>
                    <option value="search">Search engines</option>
                    <option value="social">Social media</option>
                    <option value="etsy">Etsy</option>
                    <option value="campaign">Tagged links (utm)</option>
                    <option value="referral">Other websites</option>
                    <option value="direct">Direct / unknown</option>
                  </select>
                </label>
                <label class="ctl"><input type="checkbox" id="f-cart" /> Added to cart</label>
                <label class="ctl"><input type="checkbox" id="f-problems" /> Had problems</label>
                <label class="ctl"><input type="checkbox" id="f-bounces" /> Hide 1-page visits under 10s</label>
                <label class="ctl"><input type="checkbox" id="f-bots" /> Hide possible bots</label>
                <label class="ctl">Visited page <input type="search" id="f-page" placeholder="e.g. puzzle" /></label>
                <label class="ctl">Bar scale <input type="range" id="f-scale" min="20" max="800" step="10" /></label>
              </div>
            </header>
            <main>
              <div class="summary" id="summary"></div>
              <div class="legend">
                <span><i style="background:var(--c-click)"></i>Click</span>
                <span><i style="background:var(--c-carousel)"></i>Photo carousel</span>
                <span><i style="background:var(--c-video)"></i>Video</span>
                <span><i style="background:var(--c-cart)"></i>Add to cart</span>
                <span><i style="background:var(--c-checkout)"></i>Checkout</span>
                <span><i style="background:var(--c-purchase)"></i>Purchase</span>
                <span><i style="background:var(--c-field)"></i>Form use</span>
                <span><i style="background:var(--c-scroll)"></i>Scroll</span>
                <span><i style="background:var(--c-dead)"></i>Clicked something not clickable</span>
                <span><i style="background:var(--c-problem)"></i>Rage click / error</span>
                <span><i style="background:var(--c-bot)"></i>Click flood / possible bot</span>
                <span class="muted">Bar length = time actively on the page. Click a visit's details on the left to expand.</span>
              </div>
              <div id="results"></div>
            </main>`;

          const bind = (id, event, fn) => document.getElementById(id).addEventListener(event, fn);
          document.getElementById("f-range").value = state.range;
          document.getElementById("f-source").value = state.source;
          document.getElementById("f-cart").checked = state.onlyCart;
          document.getElementById("f-problems").checked = state.onlyProblems;
          document.getElementById("f-bounces").checked = state.hideBounces;
          document.getElementById("f-bots").checked = state.hideBots;
          document.getElementById("f-page").value = state.pageFilter;
          document.getElementById("f-scale").value = state.scale;
          document.getElementById("custom-range").hidden = state.range !== "custom";

          bind("f-range", "change", (e) => {
            state.range = e.target.value;
            document.getElementById("custom-range").hidden = state.range !== "custom";
            if (state.range !== "custom") {
              loadData();
            }
          });
          const onCustom = () => {
            state.customFrom = document.getElementById("f-from").value;
            state.customTo = document.getElementById("f-to").value;
            if (state.customFrom && state.customTo) {
              loadData();
            }
          };
          bind("f-from", "change", onCustom);
          bind("f-to", "change", onCustom);
          bind("refresh", "click", loadData);
          bind("sign-out", "click", () => signOut());
          bind("f-source", "change", (e) => {
            state.source = e.target.value;
            renderResults();
          });
          bind("f-cart", "change", (e) => {
            state.onlyCart = e.target.checked;
            renderResults();
          });
          bind("f-problems", "change", (e) => {
            state.onlyProblems = e.target.checked;
            renderResults();
          });
          bind("f-bounces", "change", (e) => {
            state.hideBounces = e.target.checked;
            renderResults();
          });
          bind("f-bots", "change", (e) => {
            state.hideBots = e.target.checked;
            renderResults();
          });
          bind("f-page", "input", (e) => {
            state.pageFilter = e.target.value.trim().toLowerCase();
            renderResults();
          });
          bind("f-scale", "input", (e) => {
            state.scale = Number(e.target.value);
            renderResults();
          });

          const results = document.getElementById("results");
          results.addEventListener("click", (event) => {
            const meta = event.target.closest("[data-toggle]");
            if (!meta) {
              return;
            }
            const id = meta.getAttribute("data-toggle");
            if (state.expanded.has(id)) {
              state.expanded.delete(id);
            } else {
              state.expanded.add(id);
            }
            renderResults();
          });
          results.addEventListener("mouseover", (event) => {
            const marker = event.target.closest(".marker, .bar");
            if (!marker) {
              tooltip.style.display = "none";
              return;
            }
            tooltip.innerHTML = marker.getAttribute("data-tip") || "";
            tooltip.style.display = tooltip.innerHTML ? "block" : "none";
          });
          results.addEventListener("mousemove", (event) => {
            if (tooltip.style.display === "block") {
              const x = Math.min(event.clientX + 14, window.innerWidth - 330);
              tooltip.style.left = `${x}px`;
              tooltip.style.top = `${event.clientY + 16}px`;
            }
          });
          results.addEventListener("mouseleave", () => {
            tooltip.style.display = "none";
          });

          loadData();
        }

        function visibleSessions() {
          const sessions = state.data?.sessions || [];
          return sessions.filter((s) => {
            const stats = sessionStats(s);
            s._stats = stats;
            s._source = classifySource(s);
            if (state.source !== "all" && s._source.key !== state.source) {
              return false;
            }
            if (state.onlyCart && !stats.hasCart) {
              return false;
            }
            if (state.onlyProblems && !stats.hasProblem) {
              return false;
            }
            if (state.hideBots && stats.isBot) {
              return false;
            }
            if (state.hideBounces && s.pages.length <= 1 && stats.activeMs < 10000 && !stats.hasCart) {
              return false;
            }
            if (state.pageFilter && !s.pages.some((p) => `${p.url} ${p.title || ""}`.toLowerCase().includes(state.pageFilter))) {
              return false;
            }
            return true;
          });
        }

        function renderSummary(sessions) {
          const visitors = new Set(sessions.map((s) => s.visitorId)).size;
          const pageViews = sessions.reduce((n, s) => n + s.pages.length, 0);
          const ads = sessions.filter((s) => s._source.key === "ads").length;
          const carts = sessions.filter((s) => s._stats.hasCart).length;
          const checkouts = sessions.filter((s) => s._stats.hasCheckout).length;
          const purchases = sessions.filter((s) => s._stats.hasPurchase).length;
          const problems = sessions.filter((s) => s._stats.hasProblem).length;
          const totalActive = sessions.reduce((n, s) => n + s._stats.activeMs, 0);
          const hiddenBots = state.hideBots ? (state.data?.sessions || []).filter((s) => sessionStats(s).isBot).length : 0;
          const stat = (value, label) => `<div class="stat"><b>${value}</b><span>${label}</span></div>`;
          document.getElementById("summary").innerHTML = [
            stat(sessions.length, "visits"),
            stat(visitors, "different visitors"),
            stat(pageViews, "pages viewed"),
            stat(sessions.length ? formatDuration(totalActive / sessions.length) : "–", "average visit"),
            stat(ads, "from Google Ads"),
            stat(carts, "added to cart"),
            stat(checkouts, "started checkout"),
            stat(purchases, "purchased"),
            stat(problems, "had problems"),
            hiddenBots ? stat(hiddenBots, "possible bots hidden") : "",
          ].join("");
        }

        function markerHtml(event, page) {
          const span = Math.max(page.activeMs || 0, 1);
          const pct = Math.min(100, Math.max(0, ((event.t || 0) / span) * 100));
          const tip = `<b>${escapeHtml(EVENT_TYPES[event.type] || event.type)}</b> · ${formatDuration(event.t)}<br>${escapeHtml(event.label || "")}${
            event.detail ? `<div class="tt-detail">${escapeHtml(event.detail)}</div>` : ""
          }`;
          return `<span class="marker m-${escapeHtml(event.type)}" style="left:${pct.toFixed(2)}%" data-tip="${escapeHtml(tip)}"></span>`;
        }

        function barHtml(page) {
          const minutes = (page.activeMs || 0) / 60000;
          const width = Math.max(26, Math.round(minutes * state.scale));
          const type = pageType(page.url);
          const tip = `<b>${escapeHtml(page.title || page.url)}</b><br>${escapeHtml(page.url)}<br>${formatDuration(page.activeMs)} active · scrolled ${page.scrollPct || 0}% · ${(page.events || []).length} actions`;
          const markers = (page.events || []).map((e) => markerHtml(e, page)).join("");
          return `<div class="bar t-${type}" style="width:${width}px" data-tip="${escapeHtml(tip)}">
              <div class="bar-text"><b>${escapeHtml(page.url)}</b><span>${formatDuration(page.activeMs)}</span></div>
              ${markers}
            </div>`;
        }

        function detailsHtml(session) {
          const p = session.params || {};
          const rows = [];
          for (const page of session.pages) {
            rows.push(`<tr class="page-head"><td>${formatClock(page.startedAt)}</td><td colspan="3">${escapeHtml(page.url)} <span class="muted">— ${formatDuration(page.activeMs)} active, scrolled ${page.scrollPct || 0}%</span></td></tr>`);
            for (const e of page.events || []) {
              rows.push(`<tr><td class="muted">+${formatDuration(e.t)}</td><td>${escapeHtml(EVENT_TYPES[e.type] || e.type)}</td><td>${escapeHtml(e.label || "")}</td><td class="muted">${escapeHtml(e.detail || "")}</td></tr>`);
            }
          }
          const kv = [
            ["Landing URL", session.landingUrl],
            ["Came from", session.referrer || "(no referrer)"],
            ["Google Ads click ID", p.gclid || p.gbraid || p.wbraid],
            ["Keyword (utm_term)", p.utm_term],
            ["Campaign (utm_campaign)", p.utm_campaign],
            ["Location", [session.city, session.region, session.country].filter(Boolean).join(", ")],
            ["Device", `${session.device || ""} ${session.screen || ""}`.trim()],
            ["Language", session.language],
            ["Browser", session.userAgent],
            ["Visitor ID", session.visitorId],
          ]
            .filter(([, v]) => v)
            .map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`)
            .join("");
          return `<div class="visit-details">
              <dl class="kv">${kv}</dl>
              <table>
                <thead><tr><th>Time</th><th>Action</th><th>What</th><th>Detail</th></tr></thead>
                <tbody>${rows.join("")}</tbody>
              </table>
            </div>`;
        }

        function visitHtml(session) {
          const stats = session._stats;
          const source = session._source;
          const p = session.params || {};
          const classes = ["visit"];
          if (stats.hasPurchase) {
            classes.push("has-purchase");
          } else if (stats.hasCart) {
            classes.push("has-cart");
          } else if (stats.hasProblem) {
            classes.push("has-problem");
          }
          if (stats.isBot) {
            classes.push("is-bot");
          }
          const keyword = p.utm_term ? `<div class="keyword">“${escapeHtml(p.utm_term)}”</div>` : "";
          const where = [session.city, session.country].filter(Boolean).join(", ");
          const returning = session.priorSessions > 0 ? `${ordinal(session.priorSessions + 1)} visit` : "New visitor";
          const flags = [
            stats.hasPurchase ? '<span class="badge" style="background:#ffedd5;color:#9a3412">Purchased</span>' : "",
            stats.hasCart ? '<span class="badge" style="background:#dcfce7;color:#166534">Added to cart</span>' : "",
            stats.hasProblem ? '<span class="badge" style="background:#fee2e2;color:#991b1b">Problem</span>' : "",
            stats.isBot ? '<span class="badge" style="background:#111827;color:#f9fafb">Possible bot</span>' : "",
            stats.isThrottled
              ? '<span class="badge" title="This browser hit its sending limit, so some pages may be missing">Some pages not recorded</span>'
              : "",
          ].join("");
          const bars = session.pages.map(barHtml).join('<span class="arrow">→</span>');
          return `<div class="${classes.join(" ")}">
              <div class="visit-meta" data-toggle="${escapeHtml(session.id)}" title="Click for full details">
                <div><span class="visit-time">${formatClock(session.startedAt)}</span> <span class="badge ${source.css}">${escapeHtml(source.label)}</span></div>
                ${keyword}
                <div class="muted">${escapeHtml(where || "Unknown location")} · ${escapeHtml(session.device || "")}</div>
                <div class="muted">${returning} · ${session.pages.length} page${session.pages.length === 1 ? "" : "s"} · ${formatDuration(stats.activeMs)}</div>
                <div>${flags}</div>
              </div>
              <div class="flow">${bars || '<span class="muted">No pages recorded</span>'}</div>
              ${state.expanded.has(session.id) ? detailsHtml(session) : ""}
            </div>`;
        }

        function renderResults() {
          const results = document.getElementById("results");
          if (!results || !state.data) {
            return;
          }
          const sessions = visibleSessions();
          renderSummary(sessions);
          if (!sessions.length) {
            results.innerHTML = `<div class="empty">${
              state.data.sessions.length
                ? "No visits match these filters."
                : "No visits recorded in this date range yet. Tracking starts once the site has been published with the tracker."
            }</div>`;
            return;
          }
          const byDay = new Map();
          for (const s of sessions) {
            const key = dayKey(s.startedAt);
            if (!byDay.has(key)) {
              byDay.set(key, []);
            }
            byDay.get(key).push(s);
          }
          const days = [...byDay.keys()].sort().reverse();
          results.innerHTML = days
            .map((key) => {
              const list = byDay.get(key).sort((a, b) => b.startedAt - a.startedAt);
              const carts = list.filter((s) => s._stats.hasCart).length;
              const ads = list.filter((s) => s._source.key === "ads").length;
              return `<details class="day" open>
                  <summary>${escapeHtml(dayLabel(key))}<span class="day-counts">${list.length} visit${list.length === 1 ? "" : "s"} · ${ads} from ads · ${carts} added to cart</span></summary>
                  ${list.map(visitHtml).join("")}
                </details>`;
            })
            .join("");
        }

        // ---- Start ----

        async function start() {
          try {
            const res = await fetch("../../shared-assets/config/shopData.json", { cache: "no-store" });
            const shop = await res.json();
            state.endpoint = String(shop?.analytics?.trackerEndpoint || "").replace(/\/+$/, "");
            state.siteUrl = String(shop?.websites?.primary || "");
            state.categorySlugs = new Set(Object.keys(shop?.categories || {}));
          } catch {}
          if (!state.endpoint) {
            app.innerHTML =
              '<div class="login"><h1>Visitor analytics</h1><p class="error">No tracker endpoint is set. Add it under Site generator → Shop data → Analytics.</p></div>';
            return;
          }
          state.password = localStorage.getItem(PASSWORD_KEY) || sessionStorage.getItem(PASSWORD_KEY) || "";
          if (state.password) {
            renderDashboard();
          } else {
            renderLogin();
          }
        }

        start();
      })();
    </script>
  </body>
</html>
