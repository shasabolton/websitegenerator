<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Lets productData.js resolve shared-assets from the repo root. -->
  <base href="../../" data-site-base>
  <title>Product label</title>
  <style>
    @font-face {
      font-family: "Harrington";
      src: local("Harrington"), local("Harrington Regular");
      font-weight: 400;
      font-style: normal;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e8e2d6;
      color: #2c2416;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
    }
    .label-tools {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px 16px;
      background: #2c2416;
      color: #faf6ee;
    }
    .label-tools label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .label-tools select,
    .label-tools button {
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    .label-tools select {
      border: 1px solid #7a6a50;
      background: #fff;
      color: #2c2416;
      min-width: 140px;
    }
    .label-tools select#productSelect {
      min-width: 220px;
      max-width: 320px;
    }
    .label-tools button {
      border: 0;
      background: #faf6ee;
      color: #2c2416;
      padding: 8px 14px;
    }
    .label-tools button:hover {
      background: #fff;
    }
    .label-tools .status {
      min-height: 1.2em;
      color: #d9cbb3;
      font-size: 13px;
    }
    .canvas-wrap {
      padding: 24px 16px 48px;
      display: flex;
      justify-content: center;
      overflow: auto;
    }
    #pageCanvas {
      display: block;
      max-width: min(100%, 960px);
      height: auto;
      background: #fff;
      box-shadow: 0 8px 28px rgba(44, 36, 22, 0.18);
      cursor: default;
    }
    .image-picker {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(44, 36, 22, 0.55);
    }
    .image-picker.is-open {
      display: flex;
    }
    .image-picker-panel {
      width: min(560px, 100%);
      max-height: min(80vh, 640px);
      overflow: auto;
      background: #faf6ee;
      color: #2c2416;
      border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
      padding: 14px 16px 16px;
    }
    .image-picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .image-picker-head button {
      padding: 6px 12px;
      border: 0;
      border-radius: 4px;
      background: #2c2416;
      color: #faf6ee;
      font: inherit;
      cursor: pointer;
    }
    .image-picker-thumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .image-picker-thumb {
      width: 72px;
      height: 72px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      background: #e8e2d6;
    }
    .image-picker-thumb:hover,
    .image-picker-thumb.is-current {
      border-color: #6b3a1f;
    }
    .image-picker-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <header class="label-tools">
    <label>
      Product
      <select id="productSelect"></select>
    </label>
    <label>
      Page
      <select id="pageSizeSelect">
        <option value="A3">A3</option>
        <option value="A4" selected>A4</option>
        <option value="A5">A5</option>
      </select>
    </label>
    <label>
      Label
      <select id="orientationSelect">
        <option value="portrait">Portrait</option>
        <option value="landscape" selected>Landscape</option>
      </select>
    </label>
    <label>
      Version
      <select id="versionSelect">
        <option value="kit" selected>Kit</option>
        <option value="assembled">Assembled</option>
      </select>
    </label>
    <label>
      Tile
      <select id="tileSelect">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="8">8</option>
      </select>
    </label>
    <button type="button" id="printBtn">Print</button>
    <button type="button" id="downloadBtn">Download JPEG</button>
    <span class="status" id="status"></span>
  </header>

  <main class="canvas-wrap">
    <canvas id="pageCanvas" aria-label="Product label preview"></canvas>
  </main>

  <div id="imagePicker" class="image-picker" hidden>
    <div class="image-picker-panel" role="dialog" aria-label="Choose product image">
      <div class="image-picker-head">
        <span id="imagePickerTitle">Replace image</span>
        <button type="button" id="imagePickerClose">Close</button>
      </div>
      <div id="imagePickerThumbs" class="image-picker-thumbs"></div>
    </div>
  </div>

  <script src="tools/editData/productData.js"></script>
  <script>
    (function () {
      var DPI = 300;
      var MARGIN_MM = 5;
      var LOGO_URL = "design/cart%20logo.svg";
      var SITE_TEXT = "ContraptionCart.com";
      var CREDIT_TEXT = "Designed in Tasmania by Shasa Bolton";
      var TITLE_FONT = "Harrington";
      var TITLE_WEIGHT = "400";

      var PAGE_MM = {
        A3: { w: 297, h: 420 },
        A4: { w: 210, h: 297 },
        A5: { w: 148, h: 210 }
      };

      var productSelect = document.getElementById("productSelect");
      var pageSizeSelect = document.getElementById("pageSizeSelect");
      var orientationSelect = document.getElementById("orientationSelect");
      var versionSelect = document.getElementById("versionSelect");
      var tileSelect = document.getElementById("tileSelect");
      var downloadBtn = document.getElementById("downloadBtn");
      var printBtn = document.getElementById("printBtn");
      var statusEl = document.getElementById("status");
      var canvas = document.getElementById("pageCanvas");
      var ctx = canvas.getContext("2d");

      var catalog = [];
      var logoImage = null;
      var renderToken = 0;
      /** @type {Record<string, string[]>} slug -> [hero, small1, small2] urls */
      var slotImagesBySlug = {};
      /** @type {{ slot: number, x: number, y: number, w: number, h: number }[]} */
      var activeHitRegions = [];
      var pendingSlot = -1;

      var imagePicker = document.getElementById("imagePicker");
      var imagePickerThumbs = document.getElementById("imagePickerThumbs");
      var imagePickerTitle = document.getElementById("imagePickerTitle");
      var imagePickerClose = document.getElementById("imagePickerClose");

      function setStatus(msg) {
        statusEl.textContent = msg || "";
      }

      function mmToPx(mm) {
        return (mm / 25.4) * DPI;
      }

      function tileGrid(count, labelLandscape) {
        if (count <= 1) return { cols: 1, rows: 1 };
        if (count === 2) {
          // Stack landscape labels; place portrait labels side by side.
          return labelLandscape ? { cols: 1, rows: 2 } : { cols: 2, rows: 1 };
        }
        if (count === 4) return { cols: 2, rows: 2 };
        // 8
        return labelLandscape ? { cols: 2, rows: 4 } : { cols: 4, rows: 2 };
      }

      // Pick page orientation + label cell size so labels keep their aspect and fit with
      // margin M and inter-tile gap 2M. Page flips to whichever orientation yields larger labels.
      function planLayout() {
        var size = PAGE_MM[pageSizeSelect.value] || PAGE_MM.A4;
        var tiles = parseInt(tileSelect.value, 10) || 1;
        var labelLandscape = orientationSelect.value === "landscape";
        var aspect = labelLandscape ? Math.SQRT2 : 1 / Math.SQRT2;
        var grid = tileGrid(tiles, labelLandscape);
        var margin = mmToPx(MARGIN_MM);
        var gap = margin * 2;

        function candidate(pageWmm, pageHmm) {
          var pageW = mmToPx(pageWmm);
          var pageH = mmToPx(pageHmm);
          var availW = pageW - margin * 2 - gap * (grid.cols - 1);
          var availH = pageH - margin * 2 - gap * (grid.rows - 1);
          if (availW <= 0 || availH <= 0) return null;
          var cellH = Math.min(availW / (grid.cols * aspect), availH / grid.rows);
          var cellW = cellH * aspect;
          if (cellW <= 0 || cellH <= 0) return null;
          var blockW = grid.cols * cellW + (grid.cols - 1) * gap;
          var blockH = grid.rows * cellH + (grid.rows - 1) * gap;
          return {
            pageW: pageW,
            pageH: pageH,
            cellW: cellW,
            cellH: cellH,
            area: cellW * cellH,
            originX: (pageW - blockW) / 2,
            originY: (pageH - blockH) / 2
          };
        }

        var portrait = candidate(size.w, size.h);
        var landscape = candidate(size.h, size.w);
        var best = portrait;
        if (!best || (landscape && landscape.area > best.area)) {
          best = landscape;
        }
        if (!best) {
          return {
            pageW: mmToPx(size.w),
            pageH: mmToPx(size.h),
            margin: margin,
            gap: gap,
            grid: grid,
            cellW: 1,
            cellH: 1,
            originX: margin,
            originY: margin,
            tiles: tiles
          };
        }

        return {
          pageW: best.pageW,
          pageH: best.pageH,
          margin: margin,
          gap: gap,
          grid: grid,
          cellW: best.cellW,
          cellH: best.cellH,
          originX: best.originX,
          originY: best.originY,
          tiles: tiles
        };
      }

      function imageSrcForCanvas(url) {
        var u = String(url || "").trim();
        if (!u) return "";
        if (/^https?:\/\//i.test(u)) {
          return "https://images.weserv.nl/?url=" + encodeURIComponent(u);
        }
        return u;
      }

      function loadImage(url) {
        return new Promise(function (resolve) {
          if (!url) {
            resolve(null);
            return;
          }
          var img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = function () {
            resolve(img);
          };
          img.onerror = function () {
            if (/images\.weserv\.nl/.test(img.src) && /^https?:\/\//i.test(url)) {
              var direct = new Image();
              direct.crossOrigin = "anonymous";
              direct.onload = function () {
                resolve(direct);
              };
              direct.onerror = function () {
                resolve(null);
              };
              direct.src = url;
              return;
            }
            resolve(null);
          };
          img.src = imageSrcForCanvas(url);
        });
      }

      function drawImageCover(c, img, x, y, w, h) {
        if (!img || !img.width || !img.height || w <= 0 || h <= 0) {
          c.fillStyle = "#e8e2d6";
          c.fillRect(x, y, w, h);
          return;
        }
        var scale = Math.max(w / img.width, h / img.height);
        var dw = img.width * scale;
        var dh = img.height * scale;
        var dx = x + (w - dw) / 2;
        var dy = y + (h - dh) / 2;
        c.save();
        c.beginPath();
        c.rect(x, y, w, h);
        c.clip();
        c.drawImage(img, dx, dy, dw, dh);
        c.restore();
      }

      function drawImageContain(c, img, x, y, w, h) {
        if (!img || !img.width || !img.height || w <= 0 || h <= 0) return;
        var scale = Math.min(w / img.width, h / img.height);
        var dw = img.width * scale;
        var dh = img.height * scale;
        var dx = x + (w - dw) / 2;
        var dy = y + (h - dh) / 2;
        c.drawImage(img, dx, dy, dw, dh);
      }

      function fitText(c, text, maxWidth, fontFamily, weight, startPx, minPx) {
        var size = startPx;
        var weightPart = weight ? weight + " " : "";
        while (size > minPx) {
          c.font = weightPart + size + "px " + fontFamily;
          if (c.measureText(text).width <= maxWidth) break;
          size -= 1;
        }
        c.font = weightPart + size + "px " + fontFamily;
        return size;
      }

      function isKitVersion() {
        return versionSelect.value === "kit";
      }

      function displayTitle(product) {
        var base = String((product && product.title) || "Product").trim();
        if (!isKitVersion()) return base;
        if (/\bkit\b/i.test(base)) return base;
        return base + " Kit";
      }

      function taglineBaseParts(product) {
        var base = String((product && product.tagline) || "").trim();
        base = base
          .replace(/\s*[-–—,]?\s*DIY\s+assembly(\s+kit)?\s*$/i, "")
          .replace(/,?\s*DIY\s+assembly(\s+kit)?\s*$/i, "")
          .trim()
          .replace(/[,\s]+$/g, "");
        return base
          .split(",")
          .map(function (s) {
            return s.trim();
          })
          .filter(Boolean);
      }

      // Always at most 2 rows. Kit: append " - DIY assembly" on the last row (shared line).
      function taglineLines(product) {
        var parts = taglineBaseParts(product);
        if (parts.length > 2) {
          parts = [parts[0], parts.slice(1).join(", ")];
        }
        if (!isKitVersion()) return parts;
        if (!parts.length) return ["DIY assembly"];
        var last = parts.length - 1;
        if (/DIY\s+assembly/i.test(parts[last])) return parts;
        parts[last] = parts[last] + " - DIY assembly";
        return parts;
      }

      function drawLabel(c, product, images, x, y, w, h) {
        // Match other-repo product label: thick border, title, full-width tagline bar,
        // hero square left, two small squares in a row, logo + credit under the smalls.
        var borderWidth = h / 50;
        var halfBorder = borderWidth / 2;

        c.fillStyle = "#ffffff";
        c.fillRect(x, y, w, h);
        c.lineWidth = borderWidth;
        c.strokeStyle = "#000000";
        c.strokeRect(x + halfBorder, y + halfBorder, w - borderWidth, h - borderWidth);

        var title = displayTitle(product);
        var titleFontHeight = h / 9;
        c.fillStyle = "#ff0000";
        c.textAlign = "center";
        c.textBaseline = "alphabetic";
        fitText(
          c,
          title,
          w - borderWidth * 2,
          TITLE_FONT,
          TITLE_WEIGHT,
          titleFontHeight,
          10
        );
        c.fillText(title, x + w / 2, y + titleFontHeight);

        var descriptionArray = taglineLines(product);
        var descriptionFontHeight = h / 15;
        var descriptionBoxTop = y + titleFontHeight * 1.3;
        var descriptionBoxBottom = descriptionBoxTop;
        if (descriptionArray.length) {
          var descriptionBoxH =
            descriptionArray.length * descriptionFontHeight + descriptionFontHeight * 0.3;
          c.fillStyle = "#000000";
          c.fillRect(x, descriptionBoxTop, w, descriptionBoxH);
          descriptionBoxBottom = descriptionBoxTop + descriptionBoxH;

          c.fillStyle = "#ffffff";
          c.textAlign = "center";
          c.textBaseline = "alphabetic";
          var textY = descriptionBoxTop + descriptionFontHeight;
          var tagMaxW = w - borderWidth * 2;
          for (var row = 0; row < descriptionArray.length; row++) {
            fitText(
              c,
              descriptionArray[row],
              tagMaxW,
              "Arial",
              "",
              descriptionFontHeight,
              8
            );
            c.fillText(descriptionArray[row], x + w / 2, textY);
            textY += descriptionFontHeight;
          }
        }

        var mainImageHeight = y + h - descriptionBoxBottom - borderWidth;
        var mainImageWidth = mainImageHeight;
        var imageLeft = x + borderWidth;
        var imageTop = descriptionBoxBottom;
        var innerRight = x + w - borderWidth;

        drawImageCover(c, images[0], imageLeft, imageTop, mainImageWidth, mainImageHeight);

        var numSmall = 2;
        var mainImageRight = imageLeft + mainImageWidth;
        var smallAvail = innerRight - mainImageRight;
        var smallImageWidth = (smallAvail - borderWidth * 2) / numSmall;
        if (smallImageWidth > mainImageHeight) {
          smallImageWidth = mainImageHeight;
        }
        if (smallImageWidth < 4) smallImageWidth = 4;

        var hits = [
          { slot: 0, x: imageLeft, y: imageTop, w: mainImageWidth, h: mainImageHeight }
        ];
        for (var i = 0; i < numSmall; i++) {
          var sx = mainImageRight + borderWidth + (smallImageWidth + borderWidth) * i;
          drawImageCover(c, images[i + 1], sx, imageTop, smallImageWidth, smallImageWidth);
          hits.push({ slot: i + 1, x: sx, y: imageTop, w: smallImageWidth, h: smallImageWidth });
        }

        var padding = Math.max(10, h / 40);
        var logoTop = imageTop + smallImageWidth + padding;
        var logoAreaLeft = mainImageRight + padding;
        var logoAreaWidth = innerRight - logoAreaLeft - padding;
        var logoAreaHeight = y + h - borderWidth - logoTop;
        if (logoAreaWidth > 4 && logoAreaHeight > 4) {
          var textGap = Math.max(4, padding * 0.25);
          var logoGap = Math.max(4, padding * 0.2);
          var cx = logoAreaLeft + logoAreaWidth / 2;

          // Size URL + credit to use the full column width, then place logo just above.
          c.textAlign = "center";
          c.textBaseline = "alphabetic";
          var maxTextPx = Math.max(12, logoAreaWidth * 0.22);
          var siteSize = fitText(
            c,
            SITE_TEXT,
            logoAreaWidth,
            "Arial",
            "bold",
            maxTextPx,
            8
          );
          var creditSize = fitText(
            c,
            CREDIT_TEXT,
            logoAreaWidth,
            "Arial",
            "",
            Math.max(8, siteSize * 0.95),
            7
          );

          var creditBaseline = logoTop + logoAreaHeight - creditSize * 0.35 - Math.max(6, padding * 0.45);
          var siteBaseline = creditBaseline - creditSize - textGap;
          var textBlockTop = siteBaseline - siteSize;
          var logoBox = Math.min(
            Math.max(8, textBlockTop - logoTop - logoGap),
            logoAreaWidth * 0.7
          );
          var logoX = logoAreaLeft + (logoAreaWidth - logoBox) / 2;
          var logoY = textBlockTop - logoGap - logoBox;
          if (logoY < logoTop) {
            logoBox = Math.max(8, textBlockTop - logoTop - logoGap);
            logoX = logoAreaLeft + (logoAreaWidth - logoBox) / 2;
            logoY = logoTop;
          }
          if (logoImage) {
            drawImageContain(c, logoImage, logoX, logoY, logoBox, logoBox);
          }

          c.fillStyle = "#2c2416";
          c.font = "bold " + siteSize + "px Arial";
          c.fillText(SITE_TEXT, cx, siteBaseline);
          c.fillStyle = "#6b5c45";
          c.font = creditSize + "px Arial";
          c.fillText(CREDIT_TEXT, cx, creditBaseline);
        }

        return hits;
      }

      function selectedProduct() {
        var idx = productSelect.selectedIndex;
        if (idx < 0 || idx >= catalog.length) return null;
        return catalog[idx];
      }

      function slotUrlsForProduct(product) {
        if (!product) return ["", "", ""];
        var key = product.slug;
        if (!slotImagesBySlug[key]) {
          var defaults = (product.images || []).slice(0, 3);
          while (defaults.length < 3) defaults.push("");
          slotImagesBySlug[key] = defaults;
        }
        return slotImagesBySlug[key];
      }

      function canvasPointFromEvent(evt) {
        var rect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        return {
          x: (evt.clientX - rect.left) * scaleX,
          y: (evt.clientY - rect.top) * scaleY
        };
      }

      function hitTest(x, y) {
        for (var i = 0; i < activeHitRegions.length; i++) {
          var r = activeHitRegions[i];
          if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
            return r;
          }
        }
        return null;
      }

      function closeImagePicker() {
        pendingSlot = -1;
        imagePicker.classList.remove("is-open");
        imagePicker.hidden = true;
      }

      function openImagePicker(slotIndex) {
        var product = selectedProduct();
        if (!product) return;
        pendingSlot = slotIndex;
        var slots = slotUrlsForProduct(product);
        var current = slots[slotIndex] || "";
        var labels = ["Hero image", "Small image 1", "Small image 2"];
        imagePickerTitle.textContent = "Replace " + (labels[slotIndex] || "image");
        imagePickerThumbs.innerHTML = "";

        (product.allImages || []).forEach(function (item) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "image-picker-thumb";
          if (item.full === current) btn.classList.add("is-current");
          var img = document.createElement("img");
          img.src = item.thumb || item.full;
          img.alt = "";
          btn.appendChild(img);
          btn.addEventListener("click", function () {
            var urls = slotUrlsForProduct(product);
            urls[pendingSlot] = item.full;
            closeImagePicker();
            render();
          });
          imagePickerThumbs.appendChild(btn);
        });

        imagePicker.hidden = false;
        imagePicker.classList.add("is-open");
      }

      function render() {
        var product = selectedProduct();
        var layout = planLayout();
        var token = ++renderToken;
        activeHitRegions = [];

        canvas.width = Math.round(layout.pageW);
        canvas.height = Math.round(layout.pageH);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (!product) {
          setStatus("No product selected.");
          return;
        }

        setStatus("Rendering…");
        var urls = slotUrlsForProduct(product).slice(0, 3);
        while (urls.length < 3) urls.push("");

        Promise.all([
          loadImage(urls[0]),
          loadImage(urls[1]),
          loadImage(urls[2]),
          logoImage ? Promise.resolve(logoImage) : loadImage(LOGO_URL)
        ]).then(function (loaded) {
          if (token !== renderToken) return;
          logoImage = loaded[3] || logoImage;
          var images = [loaded[0], loaded[1], loaded[2]];
          var grid = layout.grid;
          var tiles = layout.tiles;

          for (var row = 0; row < grid.rows; row++) {
            for (var col = 0; col < grid.cols; col++) {
              var i = row * grid.cols + col;
              if (i >= tiles) continue;
              var x = layout.originX + col * (layout.cellW + layout.gap);
              var y = layout.originY + row * (layout.cellH + layout.gap);
              var hits = drawLabel(ctx, product, images, x, y, layout.cellW, layout.cellH);
              if (hits && hits.length) {
                activeHitRegions = activeHitRegions.concat(hits);
              }
            }
          }
          setStatus(displayTitle(product) + " — click an image to change it");
        });
      }

      function printPageSizeCss() {
        var sizeKey = pageSizeSelect.value || "A4";
        var layout = planLayout();
        var landscape = layout.pageW > layout.pageH;
        return sizeKey + " " + (landscape ? "landscape" : "portrait");
      }

      function printCanvas() {
        if (!canvas.width || !canvas.height) return;
        var dataUrl;
        try {
          dataUrl = canvas.toDataURL("image/png");
        } catch (err) {
          setStatus("Print failed (image CORS). Try Download JPEG instead.");
          console.error(err);
          return;
        }

        var printSize = printPageSizeCss();
        var existing = document.getElementById("printFrame");
        if (existing) existing.remove();

        var iframe = document.createElement("iframe");
        iframe.id = "printFrame";
        iframe.setAttribute("aria-hidden", "true");
        iframe.style.cssText =
          "position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none;";

        var started = false;
        function runPrint() {
          if (started) return;
          started = true;
          var doc = iframe.contentDocument;
          var win = iframe.contentWindow;
          if (!doc || !doc.head || !doc.body) {
            setStatus("Print failed.");
            return;
          }

          doc.title = "Print Label";
          while (doc.head.firstChild) doc.head.removeChild(doc.head.firstChild);
          while (doc.body.firstChild) doc.body.removeChild(doc.body.firstChild);

          var style = doc.createElement("style");
          style.textContent =
            "@page { size: " +
            printSize +
            "; margin: 0; } html, body { margin: 0; padding: 0; } img { display: block; width: 100%; height: auto; }";
          doc.head.appendChild(style);

          doc.body.style.margin = "0";
          doc.body.style.padding = "0";

          var img = doc.createElement("img");
          img.alt = "Product Label";
          img.onload = function () {
            try {
              win.focus();
              win.print();
              setStatus("Print dialog opened");
            } catch (err) {
              setStatus("Print failed.");
              console.error(err);
            }
          };
          img.onerror = function () {
            setStatus("Print failed to load label image.");
          };
          doc.body.appendChild(img);
          img.src = dataUrl;
        }

        iframe.onload = runPrint;
        document.body.appendChild(iframe);
        // about:blank may already be ready before onload fires
        if (iframe.contentDocument && iframe.contentDocument.readyState === "complete") {
          runPrint();
        }
      }

      function downloadJpeg() {
        var product = selectedProduct();
        if (!product) return;
        try {
          var link = document.createElement("a");
          var slug = product.slug || "label";
          link.download = slug + "-label.jpg";
          link.href = canvas.toDataURL("image/jpeg", 0.92);
          link.click();
          setStatus("Downloaded " + link.download);
        } catch (err) {
          setStatus("Download failed (image CORS). Try again or use local images.");
          console.error(err);
        }
      }

      function buildCatalog(products) {
        var pd = window.productData;
        var list = Array.isArray(products) ? products : [];
        var out = [];
        list.forEach(function (row) {
          if (!row || row.DIGITAL === true) return;
          if (pd && typeof pd.isProductRowDraft === "function" && pd.isProductRowDraft(row)) return;
          if (pd && typeof pd.isProductRowHidden === "function" && pd.isProductRowHidden(row)) return;

          var title =
            pd && typeof pd.resolveProductDisplayTitle === "function"
              ? pd.resolveProductDisplayTitle(row, "")
              : String(row.SHORT_TITLE || row.TITLE || "").trim();
          var slug =
            pd && typeof pd.getProductSlugForRow === "function"
              ? pd.getProductSlugForRow(row, list)
              : String(row.SLUG || "").trim();
          var imagesRaw =
            pd && typeof pd.collectProductImageUrls === "function"
              ? pd.collectProductImageUrls(row)
              : [row.IMAGE1, row.IMAGE2, row.IMAGE3].map(function (u) {
                  return String(u || "").trim();
                }).filter(Boolean);
          var allImages = imagesRaw.map(function (raw) {
            var full =
              pd && typeof pd.productImageUrlForDisplay === "function"
                ? pd.productImageUrlForDisplay(raw, "full")
                : raw;
            var thumb =
              pd && typeof pd.productImageUrlForDisplay === "function"
                ? pd.productImageUrlForDisplay(raw, "thumb")
                : raw;
            return { full: full, thumb: thumb || full };
          });
          var images = allImages.map(function (item) {
            return item.full;
          });
          if (!title || images.length < 1) return;
          out.push({
            title: title,
            slug: slug || title.toLowerCase().replace(/[^a-z0-9]+/g, "-"),
            images: images,
            allImages: allImages,
            tagline: String(row.TAGLINE || "").trim()
          });
        });
        out.sort(function (a, b) {
          return a.title.localeCompare(b.title, undefined, { sensitivity: "base" });
        });
        return out;
      }

      function populateProducts() {
        productSelect.innerHTML = "";
        catalog.forEach(function (item, i) {
          var opt = document.createElement("option");
          opt.value = String(i);
          opt.textContent = item.title;
          productSelect.appendChild(opt);
        });
      }

      function bind() {
        productSelect.addEventListener("change", function () {
          closeImagePicker();
          render();
        });
        pageSizeSelect.addEventListener("change", render);
        orientationSelect.addEventListener("change", render);
        versionSelect.addEventListener("change", render);
        tileSelect.addEventListener("change", render);
        downloadBtn.addEventListener("click", downloadJpeg);
        printBtn.addEventListener("click", printCanvas);

        canvas.addEventListener("mousemove", function (evt) {
          var pt = canvasPointFromEvent(evt);
          canvas.style.cursor = hitTest(pt.x, pt.y) ? "pointer" : "default";
        });
        canvas.addEventListener("click", function (evt) {
          var pt = canvasPointFromEvent(evt);
          var hit = hitTest(pt.x, pt.y);
          if (hit) openImagePicker(hit.slot);
        });
        imagePickerClose.addEventListener("click", closeImagePicker);
        imagePicker.addEventListener("click", function (evt) {
          if (evt.target === imagePicker) closeImagePicker();
        });
        document.addEventListener("keydown", function (evt) {
          if (evt.key === "Escape" && imagePicker.classList.contains("is-open")) {
            closeImagePicker();
          }
        });
      }

      bind();
      setStatus("Loading products…");
      loadImage(LOGO_URL).then(function (img) {
        logoImage = img;
      });

      function ensureTitleFont() {
        if (!document.fonts || typeof document.fonts.load !== "function") {
          return Promise.resolve();
        }
        return document.fonts
          .load(TITLE_WEIGHT + " 64px " + TITLE_FONT)
          .catch(function () {
            return null;
          });
      }

      var pd = window.productData;
      if (!pd || typeof pd.fetchProductDataJson !== "function") {
        setStatus("productData.js failed to load.");
        return;
      }
      Promise.all([ensureTitleFont(), pd.fetchProductDataJson()])
        .then(function (results) {
          var data = results[1];
          catalog = buildCatalog((data && data.products) || []);
          populateProducts();
          if (!catalog.length) {
            setStatus("No physical products found.");
            return;
          }
          render();
        })
        .catch(function (err) {
          console.error(err);
          setStatus("Failed to load product data.");
        });
    })();
  </script>
</body>
</html>
