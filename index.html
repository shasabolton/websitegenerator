<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Data Preview</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #fafafa;
        color: #1f2937;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
      }

      .product {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 16px;
      }

      .product h1 {
        margin-top: 0;
        margin-bottom: 16px;
      }

      .product-description {
        white-space: pre-line;
        line-height: 1.5;
      }

      .product-images {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .product-images img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="product-root" aria-live="polite"></section>
    </main>
    <script src="./script.js"></script>
  </body>
  </html>
