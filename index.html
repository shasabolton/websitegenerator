<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Data Preview</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #fafafa;
        color: #1f2937;
      }

      main {
        max-width: 100%;
        margin: 0 auto;
      }

      .table-wrapper {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: auto;
      }

      .csv-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1200px;
      }

      .csv-table th,
      .csv-table td {
        border: 1px solid #e5e7eb;
        padding: 8px;
        text-align: left;
        vertical-align: top;
        font-size: 14px;
        line-height: 1.4;
      }

      .csv-table thead th {
        position: sticky;
        top: 0;
        background: #f9fafb;
        z-index: 1;
      }

      .csv-table tbody th {
        background: #f9fafb;
        font-weight: 600;
      }

      .csv-cell {
        max-width: 280px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .empty-cell {
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="csv-root" aria-live="polite"></section>
    </main>
    <script src="./script.js"></script>
  </body>
  </html>
